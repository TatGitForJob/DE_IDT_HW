services:
  jupyter:
    build: ./jupyter
    container_name: jupyter
    ports:
      - "9191:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      JUPYTER_TOKEN: password
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shamil
      POSTGRES_PASSWORD: shaydullin
      POSTGRES_DB: bibop_bibop
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  mlapi:
    build: ./mlapi
    container_name: mlapi
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: shamil
      DB_PASSWORD: shaydullin
      DB_NAME: bibop_bibop

volumes:
  pgdata:
